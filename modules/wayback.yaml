name: wayback_module
description: wayback machine 历史 URL 聚合(web.archive.org CDX API),产出 URL_UNVERIFIED 供 httpx 探活
runtime:
  max_concurrency: 8
allowed_output_events:
  - URL_UNVERIFIED

io_contract:
  input_events:
    - DNS_NAME
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]

execution:
  command: python ./bin/wayback.py {{value}}
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
