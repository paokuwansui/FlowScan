name: crtsh_module
description: crt.sh 证书透明度(CT)日志查询,提取子域名产出 DNS_NAME
runtime:
  max_concurrency: 8
allowed_output_events:
  - DNS_NAME

io_contract:
  input_events:
    - DNS_NAME
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]

execution:
  command: python ./bin/crtsh.py {{value}}
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
