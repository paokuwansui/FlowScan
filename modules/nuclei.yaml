name: nuclei_module
description: Nuclei 漏洞扫描 — 对存活 URL 运行 high/critical 模板，VULNERABILITY 透传原始 JSON
runtime:
  max_concurrency: 2
allowed_output_events:
- VULNERABILITY
io_contract:
  input_events:
  - URL
  input_transform_code: |
    import shlex
    value = data["value"].strip()
    if not value.startswith(("http://", "https://")):
        value = "http://" + value
    return [{"target": value, "target_q": shlex.quote(value)}]
execution:
  command: 'nuclei -u {{target_q}} -severity high,critical -jsonl -silent -or -ot -rl 25 -c 15 -retries 1 -timeout 10 -ni 2>/dev/null'
  output_parse_code: |
    import json
    results = []
    seen = set()
    for line in data["stdout"].splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            json.loads(line)
        except:
            continue
        # VULNERABILITY 透传原始 JSON 行，不做解析
        key = ("VULNERABILITY", line)
        if key not in seen:
            seen.add(key)
            results.append({"VULNERABILITY": line})
    return results
