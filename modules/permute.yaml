name: permute_module
description: 子域名排列变异 — 从已发现子域名生成变体(dnsgen 风格),产出 DNS_NAME 供二次验证
runtime:
  max_concurrency: 8
allowed_output_events:
  - DNS_NAME

io_contract:
  input_events:
    - DNS_NAME
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]

execution:
  command: python ./bin/permute.py {{value}}
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
