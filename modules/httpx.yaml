name: httpx_module
description: httpx HTTP 探活 — 探测存活并产出 DNS_NAME/URL/ICON_PATH；同时把标题/状态码/技术栈/证书汇总成 FINDING(JSON)
runtime:
  max_concurrency: 8
allowed_output_events:
  - DNS_NAME
  - URL
  - ICON_PATH
  # R26:标题/状态码/技术栈/证书汇总为一条 FINDING(JSON 字符串,与 nmap 模块同风格)
  - FINDING
io_contract:
  input_events:
  - URL
  - URL_UNVERIFIED
  - OPEN_TCP_PORT
  input_transform_code: |
    import shlex, re
    value = data["value"].strip()
    return [{"target": value, "target_q": shlex.quote(value)}]
execution:
  command: httpx -title -favicon -tls-probe -status-code -json -silent -u {{target_q}} -threads 50 | python ./bin/httpx.py
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
