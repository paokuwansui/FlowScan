name: fofa_module
description: FoFaX 搜索引擎查询
runtime:
  max_concurrency: 8
allowed_output_events:
  - DNS_NAME
  - IP_ADDRESS
  - URL_UNVERIFIED

io_contract:
  input_events:
    - DNS_NAME
    - URL
    - URL_UNVERIFIED
    - IP_RANGE
    - ICON_PATH
    - IP_ADDRESS
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]
execution:
  command: 'python ./bin/fofa.py {{value}} -k {{config.fofa.api_key}}'
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            # 解析单行 JSON 并添加到列表
            ip_obj = json.loads(line)
            temp_list.append(ip_obj)
        except:
          continue
    return temp_list
