name: asn_module
description: ASN 枚举 — 域名/组织名查 bgpview 得到 ASN 及其 IP 前缀,产出 IP_RANGE 供端口扫描
runtime:
  max_concurrency: 8
allowed_output_events:
  - IP_RANGE

io_contract:
  input_events:
    - DNS_NAME
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]

execution:
  command: python ./bin/asn.py {{value}}
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
