name: reverse_whois_module
description: 反向 whois — 用组织名/域名查 viewdns 反查关联域名,产出 DNS_NAME
runtime:
  max_concurrency: 4
allowed_output_events:
  - DNS_NAME

io_contract:
  input_events:
    - DNS_NAME
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]

execution:
  command: python ./bin/reverse_whois.py {{value}}
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
