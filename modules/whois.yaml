name: whois_module
description: whois 查询注册信息,提取注册邮箱(FINDING)与 NS 关联域名(DNS_NAME)
runtime:
  max_concurrency: 8
allowed_output_events:
  - FINDING
  - DNS_NAME

io_contract:
  input_events:
    - DNS_NAME
  input_transform_code: |
    import shlex
    return [{"value": shlex.quote(data["value"])}]

execution:
  command: python ./bin/whois.py {{value}}
  output_parse_code: |
    import json
    temp_list = []
    for line in data["stdout"].strip().splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            temp_list.append(json.loads(line))
        except:
            continue
    return temp_list
