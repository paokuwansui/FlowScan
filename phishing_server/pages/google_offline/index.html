<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无法访问此网站</title>
<link rel="stylesheet" href="/pages/google_offline/style.css">
</head>
<body>
<div class="chrome-error">
  <div class="err-illustration">
    <svg class="dino" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#202124" d="M92 24h10v8h-6v6h-8v-6h-6v-6h-6v-4h6v-4h-6V8h6v-2h16v4h6v6h-6v4h8v6h-4v2h4v4h-8v-4h-6v6h-2v-6h-10v6h-6v-6h-6v6h-2v-4h6v-6h8v6h8v-4h-8v-6h10v6z"/>
      <path fill="#202124" d="M98 54h10v6h-4v6h-6v-6h-6v-6h6z"/>
    </svg>
    <div class="dino-shadow"></div>
  </div>
  <h1 class="err-title">无法访问此网站</h1>
  <p class="err-desc" id="err-desc">已拒绝连接。</p>
  <div class="err-actions">
    <button class="err-btn" id="btn-reload">重新加载</button>
    <button class="err-btn err-btn-secondary" id="btn-net">检查网络连接</button>
  </div>
  <p class="err-code">错误代码：<span id="err-code">ERR_INTERNET_DISCONNECTED</span></p>
  <p class="err-tips">此网页需要从 Internet 获取数据。若你已接入 Wi‑Fi 网络，请重新启动路由器。若使用蜂窝数据连接，请确保已开启。</p>
  <a class="err-link" href="javascript:void(0)" id="lnk-more">详细了解</a>
</div>
<script src="/pages/google_offline/app.js"></script>
</body>
</html>
