<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安全验证</title>
<link rel="stylesheet" href="/pages/verify/style.css">
</head>
<body>
<div class="ph-wrap">
  <div class="ph-card">
    <div class="ph-shield">🔒</div>
    <h1>安全验证</h1>
    <p class="ph-sub">未检测到 VPN 连接，请下载安装 VPN 后再进行访问</p>
    <div class="ph-check">
      <div class="ph-check-item fail">
        <span class="ph-check-ico">✗</span>
        <span>VPN 连接检测</span>
        <span class="ph-check-state" id="st1">未检测到</span>
      </div>
      <div class="ph-check-item fail">
        <span class="ph-check-ico">✗</span>
        <span>网络安全通道</span>
        <span class="ph-check-state" id="st2">未建立</span>
      </div>
    </div>
    <a class="ph-btn" href="#" data-download="vpn_client" style="display:block;text-decoration:none;">下载 VPN 客户端</a>
    <p class="ph-tip" id="ph-tip">安装 VPN 客户端并连接后，刷新页面即可正常访问。</p>
  </div>
  <p class="ph-foot">© 2026 安全中心 · {{host}}:{{port}}</p>
</div>
<script src="/pages/verify/app.js"></script>
</body>
</html>
