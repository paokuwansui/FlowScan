<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>噢，崩溃了</title>
<link rel="stylesheet" href="/pages/google_snap/style.css">
</head>
<body>
<div class="chrome-snap">
  <div class="snap-illustration">
    <svg class="snap-face" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="#f1f3f4"/>
      <circle cx="42" cy="50" r="6" fill="#202124"/>
      <circle cx="78" cy="50" r="6" fill="#202124"/>
      <path d="M38 76 Q60 92 82 76" stroke="#202124" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M14 60 q4 4 8 0 M98 60 q4 4 8 0" stroke="#202124" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M24 14 L40 30 M96 14 L80 30" stroke="#202124" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <h1 class="snap-title">噢，崩溃了。</h1>
  <p class="snap-desc">显示此网页时出了点问题。</p>
  <div class="snap-actions">
    <button class="snap-btn" id="btn-reload">重新加载</button>
  </div>
  <p class="snap-code">错误代码：<span id="err-code">RESULT_CODE_KILLED_BAD_MESSAGE</span></p>
  <p class="snap-tips">请稍后重试，或重新启动 Chrome。</p>
</div>
<script src="/pages/google_snap/app.js"></script>
</body>
</html>
