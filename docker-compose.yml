# ============================================================================
# FlowScan 主节点编排(单容器:redis + web + xray 内嵌同一容器)
# 用法:
#   docker compose up -d                          # 单容器跑起主节点
#
# 启动流程(entrypoint.sh 内,无外部依赖顺序):
#   1) 无条件随机化 config.yaml 密钥(每次启动都换新密码)
#   2) 内嵌 redis-server(读新密码 requirepass,纯内存不落盘)
#   3) 内嵌 xray 被动代理(后台,可用 FS3_ENABLE_XRAY=0 关闭)
#   4) 前台 web 面板(8080)
#
# 注意: worker 节点不在此文件(见 docker-compose.worker.yml),
#       主节点暴露 6379 供 worker 节点远程连接。
# ============================================================================
services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowscan:main
    container_name: flowscan-main
    restart: unless-stopped
    command: ["web", "--host", "0.0.0.0"]    # 端口从挂载的 config.yaml web_config.port 读取(配置驱动)
    ports:
      # 65000-65535 段整体映射(端口排布:web=65000 / redis=65001 / xray=65002 / c2 implant=65003 / c2 client=65004 / xss+钓鱼页面=65005)
      # 容器内其余服务如需对外,直接用段内端口即可(无需改 compose)
      - "65000-65535:65000-65535"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${WEB_PORT:-65000}/login"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ./config.yaml:/app/config.yaml          # 随机化需可写,不加 :ro
      - ./state_snapshots:/app/state_snapshots
      - ./reports:/app/reports
      - ./skills:/app/skills                    # Skill 库(Agent load_skill 用)
      - ./phishing_server/js_modules:/app/phishing_server/js_modules   # XSS 模块热加载(新增模块无需重建镜像)
      - ./phishing_server/pages:/app/phishing_server/pages           # 静态钓鱼页面热加载(新增页面无需重建镜像)
      - ./webshell_templates:/app/webshell_templates                 # WebShell 木马模板库热加载(新增模板无需重建镜像)
      - flowscan-data:/app/data
    # 无自定义网络:容器用默认 bridge。redis 访问全部经宿主端口映射
    # (config.yaml redis_host 填宿主机 docker 网关 172.17.0.1;跨机 worker 填主节点 IP)

volumes:
  flowscan-data:
